name: Build All Unlocked (MyExpenses)

on:
  workflow_dispatch:

jobs:
  build-all-unlocked:
    name: Build MyExpenses + All Companion Modules
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Bypass licensing in LicenceHandler.kt
        run: |
          FILE="myExpenses/src/main/java/org/totschnig/myexpenses/util/licence/LicenceHandler.kt"
          
          # تمديد الفترة التجريبية إلى 99 ألف يوم
          sed -i 's/const val TRIAL_DURATION_DAYS = 60L/const val TRIAL_DURATION_DAYS = 99999L/g' $FILE
          
          # إجبار التطبيق على قبول كافة الميزات الاحترافية
          sed -i 's/(this.licenceStatus?.compareTo(licenceStatus) ?: -1) >= 0/true/g' $FILE

      - name: Build Main App and ALL Companion Modules
        run: |
          ./gradlew \
            :myExpenses:assembleExternDebug \
            :webui:assembleDebug \
            :ocr:assembleDebug \
            :dropbox:assembleDebug \
            :webdav:assembleDebug \
            :fints:assembleDebug \
            :onedrive:assembleDebug \
            --stacktrace

      - name: Upload All Unlocked APKs (The Suite)
        uses: actions/upload-artifact@v4
        with:
          name: MyExpenses-Unlocked-Suite
          path: '**/build/outputs/apk/**/*.apk'
